# DeepFlow Frontend UI - Phase 2-4 Development Contract
# Version: 1.0
# Date: 2026-05-07
# Goal: Complete Task Submission, Progress Visualization, and Report functionality

contract:
  name: "deepflow_frontend_phase2_4"
  version: "1.0"
  date: "2026-05-07"
  
  prerequisite:
    phase1_complete: "Frontend scaffold running on localhost:3000/8000"
    design_doc: "docs/FRONTEND_DESIGN.md reviewed"
    requirements: "cage/frontend_design_requirements_v1.2.md aligned"
    
  scope:
    - id: "PH2-001"
      name: "Task Submission API"
      priority: "P0"
      phase: "2"
      requirements:
        - POST /api/tasks endpoint accepts domain + parameters
        - Input validation per domain type
        - Session ID generation with prefix support
        - Queue task execution through OpenClaw
        - Return task ID and initial status
        
    - id: "PH2-002"
      name: "Domain Selection UI"
      priority: "P0"
      phase: "2"
      requirements:
        - Click Domain card navigates to parameter form
        - Solution Pro form: topic, solution_type, constraints, stakeholders
        - Investment form: code, name, industry, analysis_depth
        - Form validation with soft warnings
        - Pre-filled example task (SMIC for Investment)
        
    - id: "PH2-003"
      name: "Task Confirmation & Launch"
      priority: "P0"
      phase: "2"
      requirements:
        - Summary page showing task details before submit
        - "Start Analysis" button triggers API call
        - Navigate to Progress page on success
        - Error display if submission fails
        
    - id: "PH3-001"
      name: "Progress Polling API"
      priority: "P0"
      phase: "3"
      requirements:
        - GET /api/status/{session_id} returns pipeline stage info
        - Read from blackboard/{session_id}/status.json
        - Return stage list with completion status
        - Include Harness scores when available
        
    - id: "PH3-002"
      name: "Progress Visualization UI"
      priority: "P0"
      phase: "3"
      requirements:
        - 10-stage pipeline visualization (vertical or horizontal)
        - Stage icons with Material Icons
        - Animated progress indicator
        - Estimated time remaining
        - Worker-level progress for Research stage
        
    - id: "PH3-003"
      name: "Harness Quality Dashboard"
      priority: "P0"
      phase: "3"
      requirements:
        - Display Harness V2 scores (Completeness/Necessity/Target)
        - Score visualization with progress bars
        - Quality gate warnings display-only
        - Inline notification for low scores
        
    - id: "PH4-001"
      name: "Report Retrieval API"
      priority: "P0"
      phase: "4"
      requirements:
        - GET /api/reports/{session_id} returns markdown content
        - Read from blackboard/{session_id}/final_report.md
        - Return metadata (created_at, domain, quality_score)
        
    - id: "PH4-002"
      name: "Report Viewer UI"
      priority: "P0"
      phase: "4"
      requirements:
        - Markdown rendering with syntax highlighting
        - Table of contents sidebar
        - Copy to clipboard button
        - Download as .md file
        
    - id: "PH4-003"
      name: "Report Export & Share"
      priority: "P0"
      phase: "4"
      requirements:
        - POST /api/reports/{session_id}/export (feishu/local)
        - Feishu send integration (reuse existing backend)
        - Export button in report viewer toolbar
        - Success/error feedback
        
    - id: "PH4-004"
      name: "Session History"
      priority: "P0"
      phase: "4"
      requirements:
        - GET /api/sessions returns historical sessions
        - Read from blackboard/sessions_index.json
        - Frontend list view with search/filter
        - Click to view past reports

  redlines:
    - id: "RED-FRONT-001"
      rule: "Frontend must NOT directly call OpenClaw or LLM APIs"
      severity: "P0"
    - id: "RED-FRONT-002"
      rule: "All OpenClaw interactions go through FastAPI backend"
      severity: "P0"
    - id: "RED-FRONT-003"
      rule: "No credentials exposed in frontend code or browser"
      severity: "P0"
    - id: "RED-FRONT-004"
      rule: "Single task at a time - reject concurrent submissions"
      severity: "P0"

  forbidden:
    - "Do NOT implement task cancellation (not in requirements)"
    - "Do NOT implement quality gate override (display-only)"
    - "Do NOT implement PDF export (Markdown only per requirements)"
    - "Do NOT modify existing DeepFlow core modules"
    - "Do NOT add authentication or multi-user support"

  success_criteria:
    - "User can submit task through UI in < 2 minutes"
    - "Progress updates visible at stage level"
    - "Harness scores displayed during analysis"
    - "Final report readable and exportable"
    - "Session history persists across restarts"
    - "No console errors"

  execution_order:
    - phase: "1"
      name: "Phase 2: Task Submission"
      tasks: ["PH2-001", "PH2-002", "PH2-003"]
    - phase: "2"
      name: "Phase 3: Progress Visualization"
      tasks: ["PH3-001", "PH3-002", "PH3-003"]
    - phase: "3"
      name: "Phase 4: Report & History"
      tasks: ["PH4-001", "PH4-002", "PH4-003", "PH4-004"]
    - phase: "4"
      name: "Validation"
      tasks: ["validation"]
