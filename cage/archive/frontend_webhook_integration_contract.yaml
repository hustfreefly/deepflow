# DeepFlow Frontend Webhook Integration Contract
# Version: 2.0
# Date: 2026-05-16
# Goal: Complete frontend-backend-agent integration with config-driven architecture

contract:
  name: "frontend_webhook_integration_v2"
  version: "2.0"
  date: "2026-05-16"
  
  prerequisite:
    - "Gateway running on 127.0.0.1:18789"
    - "Gateway auth token configured in openclaw.json"
    - "config.json created at ~/.openclaw/workspace/.deepflow/config.json"
    - "core/config.py created with load_config()"
    
  scope:
    - id: "WH-001"
      name: "Gateway Hooks Configuration"
      priority: "P0"
      status: "COMPLETED"
      requirements:
        - "Add hooks.enabled: true to openclaw.json"
        - "Add hooks.token: reuse gateway.auth.token or generate new"
        - "Add hooks.path: /hooks"
        
    - id: "WH-002"
      name: "Backend Webhook Trigger"
      priority: "P0"
      status: "COMPLETED"
      requirements:
        - "tasks_v2.py: after saving to SQLite, send POST to /hooks/wake"
        - "Token read from config/webhook env file (never hardcoded)"
        - "Webhook failure must NOT block task creation (fire-and-forget)"
        
    - id: "WH-003"
      name: "Agent Task Queue Processing"
      priority: "P0"
      status: "IN_PROGRESS"
      requirements:
        - "Cron Job (isolated, every 2m): primary trigger"
        - "Consumer thread (every 5s): redundant fallback"
        - "Cron Job: port check → pending check → sessions_spawn"
        - "Frontend not running → Cron returns NO_REPLY (zero cost)"
        - "No pending tasks → Cron returns NO_REPLY"
        
    - id: "WH-004"
      name: "Security & Constraints"
      priority: "P0"
      requirements:
        - "Webhook token must NOT be hardcoded in source code"
        - "Webhook call must use Bearer auth"
        - "Duplicate task protection: check status before spawn"
        - "All ports and paths from config.json (no hardcoded values)"
        
    - id: "WH-005"
      name: "Validation"
      priority: "P0"
      requirements:
        - "Frontend submits task → backend returns queued + session_id"
        - "Backend POST /hooks/wake → Gateway returns 200"
        - "Cron Job detects pending → spawns DeepFlow within 2 minutes"
        - "DeepFlow updates blackboard/status.json → frontend shows progress"
        - "Frontend closed → Cron returns NO_REPLY (zero token cost)"
        
    - id: "WH-006"
      name: "Configuration-Driven Architecture"
      priority: "P0"
      requirements:
        - "config.json at ~/.openclaw/workspace/.deepflow/config.json"
        - "All ports configurable: backend (default 17789), frontend (default 17788)"
        - "All paths relative to DEEPFLOW_ROOT"
        - "CORS origins from config"
        - "No hardcoded ports or paths in source code"
        
    - id: "WH-007"
      name: "Frontend Port Configuration"
      priority: "P0"
      requirements:
        - "Vite dev server port: configurable (default 17788)"
        - "API proxy target: configurable (default 17789)"
        - "Frontend API client: reads VITE_API_URL or uses default from config"
        
  redlines:
    - id: "RED-WH-001"
      rule: "Webhook failure must NOT block task creation"
      severity: "P0"
    - id: "RED-WH-002"
      rule: "Token must NOT be hardcoded in git-tracked source files"
      severity: "P0"
    - id: "RED-WH-003"
      rule: "No hardcoded ports or paths - all from config.json"
      severity: "P0"
      
  forbidden:
    - "Do NOT use openclaw gateway restart"
    - "Do NOT hardcode hook token in source files"
    - "Do NOT spawn DeepFlow without checking task status"
    - "Do NOT modify existing DeepFlow core modules for this integration"
    - "Do NOT hardcode ports (3000, 8000, etc.) - use config.json"
    
  success_criteria:
    - "Task submission → webhook trigger → Cron Job → DeepFlow spawn: < 2 minutes"
    - "Frontend closed → Cron Job returns NO_REPLY (zero token cost)"
    - "No console errors"
    - "Token stored securely (env var or config, not source code)"
    - "All ports configurable via config.json"
    - "Cross-platform compatible (macOS, Linux, Windows)"
    
  execution_order:
    - phase: "1"
      name: "Configuration Infrastructure"
      tasks: ["WH-006"]
      files: ["config.json", "core/config.py"]
    - phase: "2"
      name: "Backend Configuration"
      tasks: ["WH-006"]
      files: ["routers/consumer.py", "routers/tasks_v2.py", "routers/status_v2.py", "main.py"]
    - phase: "3"
      name: "Frontend Configuration"
      tasks: ["WH-007"]
      files: ["web/vite.config.ts", "web/src/api/client.ts"]
    - phase: "4"
      name: "Cron Job Setup"
      tasks: ["WH-003"]
      files: ["docs/cron/deepflow_processor.md"]
    - phase: "5"
      name: "Security & Validation"
      tasks: ["WH-004", "WH-005"]
      files: ["all"]
