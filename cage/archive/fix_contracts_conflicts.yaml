# 基础契约冲突与过界修复

## 目标
修复 4 个基础契约文件中的冲突、过界、过时内容。

## 验收标准

### 冲突修复
- [ ] 契约位置统一为 `cage/active/[module].yaml`
- [ ] 大小限制统一为 simple ≤ 5KB / medium ≤ 15KB / complex ≤ 30KB
- [ ] 验证脚本路径统一为 `scripts/validate.py` 和 `scripts/check_standards.py`

### 过界修复
- [ ] `coding_standards.md` 只保留编码规范，删除历史审计数据
- [ ] `cage_framework.md` 删除 V1.0 模块清单
- [ ] `development_workflow.md` 修正文件引用

### 职责边界清晰
- [ ] `directory_structure.md` → 只定义目录结构
- [ ] `coding_standards.md` → 只定义编码规范
- [ ] `development_workflow.md` → 只定义开发流程
- [ ] `cage_framework.md` → 只定义契约机制

## 执行步骤

1. 修复 `directory_structure.md`
   - 更新契约位置：`cage/[module].yaml` → `cage/active/[module].yaml`
   - 更新大小限制：simple ≤ 5KB / medium ≤ 15KB / complex ≤ 30KB

2. 修复 `cage_framework.md`
   - 更新契约位置：`cage/[module].yaml` → `cage/active/[module].yaml`
   - 修正脚本路径：`cage/validate.py` → `scripts/validate.py`
   - 修正脚本路径：`cage/check_standards.py` → `scripts/check_standards.py`
   - 删除 Section 6 模块契约清单（V1.0 过时内容）

3. 修复 `development_workflow.md`
   - 更新大小限制：simple ≤ 5KB / medium ≤ 15KB / complex ≤ 30KB
   - 修正脚本路径
   - 修正文件引用：`V1_BLUEPRINT.md` → `DIRECTORY_STRUCTURE_CONTRACT.md`
   - 修正文件引用：`cage/templates/module_contract.yaml` → `cage_framework.md`
   - 删除重复的编码规范定义（保留 `coding_standards.md` 为唯一来源）

4. 修复 `coding_standards.md`
   - 删除 P0 严重问题总览（历史审计数据）
   - 删除审计发现汇总（历史审计数据）
   - 删除修复检查清单（待办事项）
   - 保留规范定义（日志、Score、类型注解、Import、命名、防御性编程）
   - 保留使用编码风格检查器（工具用法）
   - 保留关键成功指标（目标值）

5. 验证
   - 检查所有契约位置引用是否统一
   - 检查所有大小限制是否统一
   - 检查所有脚本路径是否正确
   - 检查所有文件引用是否存在
   - 检查职责边界是否清晰

