# DeepFlow Frontend Quality Contract
# Version: 1.0 | 2026-05-16
# Goal: Fix remaining P0 issues from v1.0 completion review

contract:
  name: "frontend_quality_fixes_v1"
  
  scope:
    - id: "WH-008"
      name: "Polling Interval Configuration"
      priority: "P0"
      requirements:
        - "All polling intervals (3000ms, 5000ms) from config.json"
        - "Zero hardcoded intervals in source (except UI feedback 2000ms)"
        
    - id: "WH-009"
      name: "database.py Naming Convention"
      priority: "P0"
      requirements:
        - "TaskRecord → Task (matches contract)"
        - "All imports use consistent name"
        
    - id: "WH-010"
      name: "E2E Test Infrastructure"
      priority: "P1"
      requirements:
        - "Basic E2E test: submit → webhook → progress → report"
        - "Dry-run mode (no actual Agent spawn)"
        
    - id: "WH-011"
      name: "Edge Case Error Handling"
      priority: "P1"
      requirements:
        - "Network disconnect detection"
        - "User-friendly offline indicator"
        
  execution_order:
    - phase: "1"
      tasks: ["WH-008", "WH-009"]
    - phase: "2"
      tasks: ["WH-010", "WH-011"]
      
  success_criteria:
    - "Zero hardcoded polling intervals"
    - "All naming matches contract"
    - "No TypeScript errors"
    - "No console errors in browser"
