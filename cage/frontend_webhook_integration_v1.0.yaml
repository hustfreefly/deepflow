# DeepFlow Frontend Webhook Integration Contract v1.0
# 采用契约笼子三层强制机制

metadata:
  name: frontend_webhook_integration_v1.0
  version: "1.0"
  created: "2026-05-08"
  status: active
  description: "FastAPI Webhook + Cron Job 混合方案，实现前端全自动调用 DeepFlow"

phases:
  - name: Phase 1 - OpenClaw Webhook 配置
    description: 安全修改 OpenClaw 配置，启用 Webhook 支持
    deliverables:
      - path: scripts/setup_webhook_config.sh
        description: Webhook 配置安全设置脚本
        requirements:
          - 检查服务模式（LaunchAgent）
          - 生成独立 hooks token（≠ gateway token）
          - 创建配置备份
          - 使用 openclaw config patch 添加配置
          - 验证 token 独立性
          - 安全重启 Gateway（launchctl kickstart）
          - 健康检查
        max_lines: 150
      - path: scripts/verify_webhook.sh
        description: Webhook 端点测试脚本
        requirements:
          - 测试 /hooks/wake 端点
          - 验证响应状态
          - 检查日志
        max_lines: 80
    gates:
      - type: syntax
        command: bash -n {file}
      - type: execution
        command: bash {file}
        expected_output: "✅ Gateway restarted successfully"

  - name: Phase 2 - FastAPI Webhook 调用
    description: 修改 FastAPI，添加 Webhook 调用和 SQLite 任务队列
    deliverables:
      - path: frontend/backend/database.py
        description: SQLite 任务队列数据库模型
        requirements:
          - Task 表（id, session_id, domain, status, created_at, updated_at）
          - 初始化数据库
          - CRUD 操作
        max_lines: 150
      - path: frontend/backend/routers/tasks_v2.py
        description: 新版任务提交 API（带 Webhook）
        requirements:
          - 提交任务到 SQLite
          - 调用 /hooks/wake
          - 带重试机制（3次）
          - 失败时标记为 pending_notification
        max_lines: 200
      - path: frontend/backend/routers/status_v2.py
        description: 状态查询 API（从 Blackboard 读取）
        requirements:
          - 查询任务状态
          - 返回进度信息
        max_lines: 100
    gates:
      - type: syntax
        command: python -m py_compile {file}
      - type: import
        command: python -c "import {module}"
      - type: test
        command: python -m pytest tests/test_webhook_api.py -v
        min_pass_rate: 100

  - name: Phase 3 - 主Agent Webhook 处理器
    description: 实现主Agent接收 Webhook 并 spawn DeepFlow
    deliverables:
      - path: agents/webhook_task_processor.py
        description: Webhook 任务处理器
        requirements:
          - 读取 SQLite 任务队列
          - 过滤 pending 状态任务
          - 调用 sessions_spawn 启动 DeepFlow
          - 更新任务状态为 running
          - 处理 DeepFlow 完成后的状态更新
        max_lines: 250
      - path: agents/hooks/deepflow_webhook_handler.py
        description: OpenClaw Hook 处理器（如果支持）
        requirements:
          - 接收 webhook 事件
          - 调用 task_processor
        max_lines: 100
    gates:
      - type: syntax
        command: python -m py_compile {file}
      - type: import
        command: python -c "import {module}"

  - name: Phase 4 - Cron Job 兜底
    description: 配置 OpenClaw Cron Job，定期检查未处理任务
    deliverables:
      - path: scripts/setup_cron_job.sh
        description: Cron Job 配置脚本
        requirements:
          - 创建每30秒的 Cron Job
          - 调用主Agent检查任务队列
          - 验证 Cron Job 创建成功
        max_lines: 100
      - path: agents/cron_task_checker.py
        description: Cron Job 任务检查器
        requirements:
          - 检查 SQLite 中 pending 超过30秒的任务
          - 调用 task_processor 处理
          - 避免重复处理（状态检查）
        max_lines: 150
    gates:
      - type: syntax
        command: python -m py_compile {file}
      - type: execution
        command: openclaw cron list | grep deepflow_task_processor

quality_gates:
  p0:
    - gateway_token ≠ hooks_token（验证脚本）
    - Gateway 重启成功（health check）
    - Webhook 端点可访问（curl 测试）
    - SQLite 数据库可读写
    - 任务提交 → Webhook 触发 → 状态更新（E2E 测试）
  p1:
    - 代码有类型注解
    - 所有函数有 docstring
    - 错误处理完整
  p2:
    - 日志记录完善
    - 配置可调整（超时、重试次数）

signoff:
  required_reviews: 1
  auto_merge: false
  verification_command: |
    # 完整验证流程
    1. bash scripts/setup_webhook_config.sh
    2. bash scripts/verify_webhook.sh
    3. python -m pytest tests/integration/test_webhook_flow.py -v
    4. openclaw cron list | grep deepflow_task_processor
