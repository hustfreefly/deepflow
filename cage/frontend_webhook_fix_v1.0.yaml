# DeepFlow Webhook Integration Fix Contract v1.0
# 修复 Phase 1-4 代码审查发现的所有问题

metadata:
  name: frontend_webhook_fix_v1.0
  version: "1.0"
  created: "2026-05-09"
  status: active
  description: "修复代码审查发现的所有 P0/P1/P2 问题"

# P0 问题（必须修复）
p0_fixes:
  - id: P0-1
    title: "except Exception 滥用（7处）"
    files:
      - core/agents/webhook_task_processor.py:133,170,213,244
      - frontend/backend/routers/tasks_v2.py:114
      - frontend/backend/routers/status_v2.py:74
      - core/agents/cron_task_checker.py:47
    fix: "改为具体异常类型，如 except (ImportError, RuntimeError) as e:"
  
  - id: P0-2
    title: "status_v2.py 第104行 bare except"
    file: frontend/backend/routers/status_v2.py:104
    fix: "改为 except (json.JSONDecodeError, IOError):"
  
  - id: P0-3
    title: "status_v2.py 路径遍历风险"
    file: frontend/backend/routers/status_v2.py:18,23
    fix: "添加 session_id 验证，确保路径在 BLACKBOARD_DIR 内"
  
  - id: P0-4
    title: "webhook_task_processor.py 导入 openclaw 注释不清晰"
    file: core/agents/webhook_task_processor.py:41-46
    fix: "添加明确警告注释，说明 exec 环境导入会失败"

# P1 问题（建议修复）
p1_fixes:
  - id: P1-1
    title: "类型注解不完整"
    files:
      - core/agents/webhook_task_processor.py
      - frontend/backend/database.py
      - frontend/backend/routers/tasks_v2.py
    fix: "添加完整的返回值类型注解"
  
  - id: P1-2
    title: "asyncio.sleep 在同步函数中"
    file: core/agents/webhook_task_processor.py:207
    fix: "改为 time.sleep(0.5)"
  
  - id: P1-3
    title: "uuid 模块在函数内导入"
    file: frontend/backend/routers/tasks_v2.py:120
    fix: "移到文件顶部导入"
  
  - id: P1-4
    title: "webhook_task_processor.py 行数超限"
    file: core/agents/webhook_task_processor.py
    current_lines: 280
    max_lines: 250
    fix: "拆分为多个模块或精简代码"

# P2 问题（可选优化）
p2_fixes:
  - id: P2-1
    title: "缺少日志记录配置"
    fix: "添加结构化日志记录"
  
  - id: P2-2
    title: "缺少单元测试"
    fix: "添加 pytest 单元测试"
  
  - id: P2-3
    title: "database.py 缺少连接池"
    fix: "使用连接池优化性能"

# 质量门禁
gates:
  - type: syntax
    command: python3 -m py_compile {file}
  - type: standards
    command: python3 cage/check_standards.py {file}
    p0_max: 0
    p1_max: 0
  - type: security
    command: grep -n "except:" {file} && exit 1 || exit 0
  - type: test
    command: python3 -m pytest tests/test_webhook_fix.py -v
    min_pass_rate: 100

signoff:
  required_reviews: 1
  verification: |
    # 验证所有 P0 已修复
    python3 cage/check_standards.py core/agents/webhook_task_processor.py
    python3 cage/check_standards.py frontend/backend/routers/status_v2.py
    python3 cage/check_standards.py frontend/backend/routers/tasks_v2.py
    
    # 验证无 bare except
    ! grep -rn "except:" --include="*.py" core/agents/ frontend/backend/
