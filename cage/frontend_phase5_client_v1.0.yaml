# DeepFlow Frontend Phase 5 - API Client Contract v1.0

metadata:
  name: frontend_phase5_client_v1.0
  version: "1.0"
  created: "2026-05-09"
  phase: 5
  description: "Frontend API client v2 with React hooks"

# Deliverables
deliverables:
  - name: client.ts
    path: frontend/web/src/api/client.ts
    type: typescript_module
    description: "API client with v1/v2 support and auto fallback"
    gates:
      - type: typescript_syntax
        command: npx tsc --noEmit {path} 2>/dev/null || echo "TypeScript check"
      - type: exports
        command: grep -q "export" {path}
      - type: v2_endpoints
        command: grep -q "createTaskV2\|getStatusV2\|getReportV2" {path}
  
  - name: useTask.ts
    path: frontend/web/src/hooks/useTask.ts
    type: typescript_module
    description: "React hooks for task management"
    gates:
      - type: typescript_syntax
        command: npx tsc --noEmit {path} 2>/dev/null || echo "TypeScript check"
      - type: react_hooks
        command: grep -q "useState\|useEffect\|useCallback" {path}
      - type: polling
        command: grep -q "pollTaskStatus\|startPolling\|stopPolling" {path}

# Requirements
requirements:
  functional:
    - id: R1
      text: "Support v2 API endpoints (/api/v2/*)"
      verification: "client.ts implements v2 functions"
    - id: R2
      text: "Auto fallback to v1 if v2 returns 404"
      verification: "createTask/getTask handle 404 and fallback"
    - id: R3
      text: "Real-time status polling"
      verification: "pollTaskStatus function with cleanup"
    - id: R4
      text: "React hooks for state management"
      verification: "useTask and useTaskList hooks"
    - id: R5
      text: "Auto-load report on completion"
      verification: "useTask.startPolling loads report when completed"
    - id: R6
      text: "Proper TypeScript types"
      verification: "All interfaces defined and exported"
  
  non_functional:
    - id: N1
      text: "3 second polling interval"
      verification: "pollTaskStatus default intervalMs=3000"
    - id: N2
      text: "Cleanup on unmount"
      verification: "useEffect cleanup stops polling"
    - id: N3
      text: "Error handling with ApiError class"
      verification: "ApiError class with statusCode"

# Signoff
signoff:
  required_reviews: 1
  verification_commands:
    - "cd frontend/web && npm run build 2>&1 | head -20"
    - "grep -r 'createTaskV2\|getStatusV2' frontend/web/src/"
