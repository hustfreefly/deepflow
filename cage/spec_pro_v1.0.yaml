# DeepFlow Spec Pro (需求分析模块) Contract v1.0
# 需求分析 V0.1: 文档上传 → LLM 自动提取 → 结构化需求 → Solution Pro 输入

metadata:
  name: spec_pro_v1.0
  version: "1.0"
  created: "2026-05-15"
  status: active
  complexity: medium
  description: "用户上传需求文档 → Spec Pro 自动提取结构化需求 → 提交 Solution Pro 执行"
  product_name: "Spec Pro"
  code_name: "spec_pro"
  relationship:
    upstream: "用户（文档/粘贴文本）"
    downstream: "Solution Pro（执行引擎）"
    future: "V2.0 多轮对话引导 + 迭代完善需求"

# ── 红线（继承自前端开发契约 + 架构约束） ──
redlines:
  - id: "RED-SPEC-001"
    rule: "Spec Pro 前端 CANNOT 直接调用 LLM API"
    severity: "P0"
    source: "frontend_phase2_4_contract.yaml RED-FRONT-001"
  - id: "RED-SPEC-002"
    rule: "所有 LLM 交互必须通过 FastAPI 后端 → OpenClaw"
    severity: "P0"
    source: "frontend_phase2_4_contract.yaml RED-FRONT-002"
  - id: "RED-SPEC-003"
    rule: "凭证不可暴露到前端代码或浏览器 Network 面板"
    severity: "P0"
    source: "frontend_phase2_4_contract.yaml RED-FRONT-003"
  - id: "RED-SPEC-004"
    rule: "exec 环境禁止 import openclaw"
    severity: "P0"
    source: "AGENTS.md / MEMORY.md"
  - id: "RED-SPEC-005"
    rule: "Spec Pro 不得修改 Solution Pro 核心引擎代码"
    severity: "P0"
    source: "frontend_design_requirements_v1.2.md §9 C1"

# ── 接口契约（L1） ──
interface:
  upload_endpoint:
    method: POST
    path: /api/v2/upload
    content_type: multipart/form-data
    input:
      file:
        type: file
        formats: [".md", ".txt"]
        max_size_mb: 10
      solution_type:
        type: string
        optional: true
        enum: ["architecture", "business", "technical"]
        description: "用户预选方案类型（可选）"
    
    output:
      200_success:
        schema:
          type: object
          required: [topic, extracted_text]
          properties:
            topic: {type: string, minLength: 5, maxLength: 200}
            solution_type: {type: string, enum: ["architecture", "business", "technical", null]}
            constraints: {type: array, items: {type: string}, maxItems: 5}
            stakeholders: {type: array, items: {type: string}, maxItems: 10}
            extracted_text: {type: string}
            confidence: {type: number, minimum: 0, maximum: 1}
      400_bad_request:
        conditions: ["unsupported_format", "empty_file"]
      413_payload_too_large:
        condition: "file > 10MB"
      504_gateway_timeout:
        condition: "LLM extraction timeout"

  llm_extractor:
    method: extract_requirements(text: str, solution_type: str | None) -> dict
    input:
      text: "文档原始文本内容"
      solution_type: "用户预选类型（可为 None）"
    output:
      type: dict
      schema:
        topic: "提取的设计主题"
        solution_type: "推断的方案类型"
        constraints: "约束条件列表"
        stakeholders: "干系人列表"
        confidence: "提取置信度 0-1"
    
    success: "返回结构化提取结果 + 原始文本"
    failure: "返回原始文本 + 空结构化数据（confidence=0），不抛异常"

  file_reader:
    method: read_file(file_path: str) -> str
    input:
      file_path: "上传文件临时路径"
    output:
      type: str
      constraints: ["去除 BOM", "UTF-8 编码", "截断 50000 字符"]
    success: "返回文件文本内容"
    failure: "抛出 ValueError（编码错误/文件不存在）"

  upload_cleanup:
    method: cleanup_uploads(retention_hours: int = 24) -> int
    input:
      retention_hours: "文件保留时长"
    output:
      type: int
      description: "已删除文件数量"
    success: "删除超过 retention_hours 的临时文件"
    failure: "静默处理，记录日志"

# ── 行为契约（L2） ──
behavior:
  processing_flow:
    step_1: "FastAPI 接收 multipart 文件，验证格式和大小"
    step_2: "读取文件内容到临时目录"
    step_3: "调用 spec_extractor.extract_requirements()"
    step_4: "LLM 提取结构化信息"
    step_5: "返回提取结果（200）或错误（4xx/5xx）"

  llm_extraction:
    model: "bailian/qwen3.6-plus"
    timeout_seconds: 30
    prompt_template: |
      你是一个需求分析专家。请从以下文档中提取结构化信息：
      
      1. **topic**（设计主题）：5-200字的一句话描述
      2. **solution_type**：architecture / business / technical
      3. **constraints**：约束条件列表，最多5条
      4. **stakeholders**：利益相关者列表，最多10个
      
      以 JSON 格式输出，不要额外解释。
    json_extraction: true
    fallback_on_failure: true

  error_recovery:
    unsupported_format: "返回 400，列出支持的格式"
    file_too_large: "返回 413，提示文件大小限制"
    empty_file: "返回 400"
    llm_timeout: "返回原始文本 + 空结构化数据，confidence=0"
    llm_api_error: "同上，降级为用户手动填写"
    upload_dir_error: "返回 500，记录错误日志"

  file_lifecycle:
    upload_dir: "frontend/backend/uploads/"
    naming: "{uuid4}.{ext}"
    retention_hours: 24
    cleanup_on_startup: true
    cleanup_on_response: false  # 避免并发问题

# ── 依赖（L3） ──
dependencies:
  - "frontend.backend.database.get_db"
  - "fastapi.UploadFile"
  - "openclaw sessions_spawn (通过 Webhook 注入)"

# ── 数据契约（L4） ──
data:
  upload_storage:
    location: "frontend/backend/uploads/"
    format: "临时文件，不持久化"
    cleanup: "启动时 + 定时任务（24h）"
  
  no_database: true
  rationale: "上传是临时操作，提取完成后不需要持久化"

# ── 前端交互契约 ──
frontend:
  upload_ui:
    component: "SpecUpload.tsx"
    interactions: ["drag_and_drop", "click_to_browse"]
    states: ["idle", "uploading", "processing", "success", "error"]
  
  result_display:
    layout: "提取结果可编辑表单"
    fields: ["topic", "solution_type", "constraints[]", "stakeholders[]"]
    actions: ["确认提交", "手动修改", "重新上传"]
  
  task_form_integration:
    location: "TaskForm.tsx (Solution Pro 表单区域)"
    behavior: "上传后自动填充提取结果，用户可修改"
    fallback: "用户可跳过上传，直接手动填写"

# ── 交付物清单 ──
deliverables:
  backend:
    - path: "frontend/backend/routers/upload.py"
      description: "上传端点 + 文件验证 + 内容读取"
      max_lines: 120
      gates:
        - type: syntax
          command: "python -m py_compile {file}"
        - type: import
          command: "python -c 'from routers.upload import router'"
    
    - path: "frontend/backend/spec_extractor.py"
      description: "LLM 提取引擎"
      max_lines: 150
      gates:
        - type: syntax
          command: "python -m py_compile {file}"
        - type: import
          command: "python -c 'from spec_extractor import SpecExtractor'"

  frontend:
    - path: "frontend/web/src/components/SpecUpload.tsx"
      description: "拖拽上传组件"
      max_lines: 150
      gates:
        - type: typescript_syntax
          command: "cd frontend/web && npx tsc --noEmit 2>/dev/null || echo 'TypeScript check'"
    
    - path: "frontend/web/src/pages/TaskForm.tsx"
      description: "修改：集成 SpecUpload 组件"
      change_type: "modify"
      max_added_lines: 80

# ── 质量门禁 ──
quality_gates:
  p0:
    - "POST /api/v2/upload 接收 .md/.txt 文件"
    - "返回符合 schema 的 JSON"
    - "大文件/不支持格式返回正确错误码"
    - "LLM 提取失败不阻断流程，降级为手动填写"
    - "RED-SPEC-001 到 RED-SPEC-005 全部通过"
  p1:
    - "类型注解完整"
    - "所有函数有 docstring"
    - "错误处理覆盖所有分支"
    - "无 bare except"
  p2:
    - "上传组件有视觉反馈（拖拽高亮、进度条）"
    - "提取结果可编辑"
    - "上传目录有清理机制"

# ── 开发步骤 ──
development_steps:
  - step: 1
    action: "创建契约文件"
    output: "cage/spec_pro_v1.0.yaml"
    status: done
  
  - step: 2
    action: "后端上传端点"
    output: "routers/upload.py"
    gates: [syntax, import]
  
  - step: 3
    action: "LLM 提取引擎"
    output: "spec_extractor.py"
    gates: [syntax, import]
  
  - step: 4
    action: "前端上传组件"
    output: "SpecUpload.tsx"
    gates: [typescript_syntax]
  
  - step: 5
    action: "表单集成"
    output: "TaskForm.tsx 修改"
    gates: [typescript_syntax]
  
  - step: 6
    action: "端到端验证"
    output: "手动测试：上传 → 提取 → 确认 → 提交"

# ── 与 Solution Pro 的衔接 ──
integration_with_solution_pro:
  input_mapping:
    spec_pro.topic → solution_pro.topic
    spec_pro.solution_type → solution_pro.solution_type
    spec_pro.constraints → solution_pro.constraints
    spec_pro.stakeholders → solution_pro.stakeholders
  trigger: "用户确认提取结果后自动调用现有 Solution Pro 提交 API"
  backward_compat: "用户可跳过 Spec Pro，直接填写表单"

# ── 未来演进 ──
future_roadmap:
  v2.0:
    - "多轮对话引导用户完善需求"
    - "支持 PDF 格式（PyMuPDF 解析）"
    - "独立 Agent 运行"
    - "输出 structured_requirements.json"
  v3.0:
    - "Solution Pro 内部集成 Spec Pro 作为 Stage 0"
    - "直接接受非结构化输入"

# ── Signoff ──
signoff:
  required_reviews: 1
  auto_merge: false
  verification_command: |
    1. python -m py_compile frontend/backend/routers/upload.py
    2. python -m py_compile frontend/backend/spec_extractor.py
    3. cd frontend/web && npx tsc --noEmit 2>/dev/null || echo 'TypeScript check'
    4. curl -X POST http://localhost:8000/api/v2/upload -F "file=@test.md"
    5. 手动测试：打开 http://localhost:3000 → 上传文档 → 确认提取结果 → 提交
