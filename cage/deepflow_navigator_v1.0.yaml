# DeepFlow 导览页契约 V1.0

## 元数据
- 创建时间: 2026-05-29
- 版本: 1.0
- 状态: active

## 契约规则

### 1. 内容结构
- 标题必须包含: `🚀 DeepFlow — 专业级多Agent协作系统`
- 副标题必须包含: `从想法到方案，一站式搞定`
- 引导问题必须包含: `你现在处于哪个阶段？`

### 2. 模块描述
必须包含三个模块，每个模块包含：
- 状态标签（emoji + 状态描述）
- 模块名称和链接
- 耗时说明（括号内）

模块列表：
1. Spec Pro - 5-10分钟
2. Solution Pro - 40-60分钟
3. 具体分析（Investment 30-40分钟 + DeepClaw）

### 3. CTA（行动召唤）
必须包含: `直接回复你的想法，我来安排 👇`

### 4. 字数限制
总字数 ≤ 160 字

## 验证方法
1. 正则检查关键字存在性
2. 字数统计
3. 结构完整性检查

## 验收标准
- [x] 所有必需文本存在
- [x] 三个模块完整
- [x] 每个模块有耗时说明
- [x] CTA 存在
- [x] 总字数 ≤ 160
