# DeepFlow 文档更新契约
# 版本: 1.0
# 日期: 2026-05-06
# 目标: 统一文档版本、消除设计漂移、归档历史文档

contract:
  name: "deepflow_docs_update"
  version: "1.0"
  date: "2026-05-06"
  
  # 前置禁令确认
  prerequisite:
    bans_read: true
    exec_env_check: "pass"  # 文档更新不涉及 spawn
    agent_run_check: "pass"
    spawn_capability: "confirmed"  # 需要 spawn 子 Agent 做验证
  
  # 架构红线检查
  redlines:
    - id: "RED-003"
      check: "成功模式参考确认"
      status: "pass"
      note: "参考 AGENTS.md 文档更新规范"

  # 更新范围
  scope:
    - id: "DOC-001"
      file: "docs/ARCHITECTURE.md"
      action: "update"
      priority: "P0"
      reason: "严重过时，未包含 Solution Pro V3.1"
      requirements:
        - 更新版本号至 1.2
        - 更新日期至 2026-05-06
        - 第二部分添加 Solution Pro 架构说明
        - 第三部分更新差异分析（Solution Pro 已实现质量门禁/收敛检测）
        - 演进路线图更新（标记已实现的 0.2.0/0.3.0 目标）
      
    - id: "DOC-002"
      file: "README.md"
      action: "update"
      priority: "P0"
      reason: "版本号不一致（0.1.0 vs CHANGELOG 0.1.1）"
      requirements:
        - 更新版本号为 0.1.1
        - 添加 Solution Pro 独立文档链接
        - 确认所有引用路径有效
      
    - id: "DOC-003"
      file: "SKILL.md"
      action: "update"
      priority: "P0"
      reason: "严重过时（2026-04-23），硬编码路径，无 Solution Pro"
      requirements:
        - 替换硬编码路径为 PathConfig 动态路径
        - 添加 Solution Pro 触发方式
        - 更新执行流程示例
        - 更新版本号为 0.1.1
      
    - id: "DOC-004"
      file: "docs/QUICKSTART.md"
      action: "update"
      priority: "P1"
      reason: "仅覆盖投资分析，需添加 Solution Pro 快速开始"
      requirements:
        - 保留投资分析快速开始
        - 添加 Solution Pro 快速开始章节
        - 统一 session_id 命名规范
      
    - id: "DOC-005"
      file: "docs/RFC-001-prompt-registry.md"
      action: "update"
      priority: "P1"
      reason: "状态不一致（Draft vs README 说已完成）"
      requirements:
        - 更新状态为 "已实现"
        - 添加实现摘要
        - 标记为历史文档或归档
      
    - id: "DOC-006"
      file: "docs/V4_ARCHITECTURE_PLAN.md"
      action: "archive"
      priority: "P1"
      reason: "已标记历史文档，应在 archive/ 目录"
      requirements:
        - 移入 docs/archive/
        - 更新 ARCHITECTURE.md 中的引用
      
    - id: "DOC-007"
      file: "docs/V4_DECISION_SUMMARY.md"
      action: "archive"
      priority: "P1"
      reason: "决策已执行完毕"
      requirements:
        - 移入 docs/archive/
      
    - id: "DOC-008"
      file: "docs/V4_IMPLEMENTATION_SPEC.md"
      action: "archive"
      priority: "P1"
      reason: "实施已完成"
      requirements:
        - 移入 docs/archive/
      
    - id: "DOC-009"
      file: "docs/V4_COMPLETE_SPEC.md"
      action: "archive"
      priority: "P1"
      reason: "V4 已完成，当前是 V3.1 Solution Pro"
      requirements:
        - 移入 docs/archive/
      
    - id: "DOC-010"
      file: "docs/V4_FINAL_DESIGN.md"
      action: "archive"
      priority: "P1"
      reason: "V4 已完成，当前是 V3.1 Solution Pro"
      requirements:
        - 移入 docs/archive/
      
    - id: "DOC-011"
      file: "docs/V4_CORRECTION.md"
      action: "archive"
      priority: "P1"
      reason: "修正已应用"
      requirements:
        - 移入 docs/archive/

  # 验证标准
  validation:
    - name: "版本号一致性"
      check: "所有文档版本号统一为 0.1.1"
      method: "grep '0.1.0\|0.1.1' README.md SKILL.md docs/*.md"
    
    - name: "无硬编码路径"
      check: "SKILL.md 和 QUICKSTART.md 无 /Users/allen/ 硬编码"
      method: "grep '/Users/allen/' README.md SKILL.md docs/*.md"
      expected: "0 matches"
    
    - name: "链接有效性"
      check: "所有内部引用链接指向存在的文件"
      method: "检查 ARCHITECTURE.md README.md 中的相对链接"
    
    - name: "归档完成"
      check: "所有标记 archive 的文档已移入 docs/archive/"
      method: "ls docs/archive/ | grep V4"

  # 成功标准
  success_criteria:
    - "所有 P0 文档已更新"
    - "所有 P1 文档已归档或更新"
    - "版本号一致性验证通过"
    - "无硬编码路径验证通过"
    - "归档文档已从 docs/ 根目录移除"

  # 执行顺序
  execution_order:
    - phase: "1"
      name: "归档历史文档"
      tasks: ["DOC-006", "DOC-007", "DOC-008", "DOC-009", "DOC-010", "DOC-011"]
    
    - phase: "2"
      name: "更新核心文档"
      tasks: ["DOC-001", "DOC-002", "DOC-003"]
    
    - phase: "3"
      name: "补充辅助文档"
      tasks: ["DOC-004", "DOC-005"]
    
    - phase: "4"
      name: "验证闭环"
      tasks: ["validation"]
