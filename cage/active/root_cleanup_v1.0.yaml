cage_version: "1.0.0"
component: root_cleanup
status: active
# root_cleanup_v1.0.yaml
# DeepFlow 根目录文件清理 — 修复违反契约的问题

module: "root_cleanup"
version: "1.0"
complexity: "simple"
created: "2026-05-30"
status: "active"

description: |
  修复根目录文件违反 DIRECTORY_STRUCTURE_CONTRACT 的问题。
  目标：根目录清洁 + 配置有效 + 归档规范。

# ============================================================================
# 红线（P0 — 绝对不可违反）
# ============================================================================
redlines:
  - id: "RED-ROOT-001"
    rule: "根目录禁止有 __pycache__/ 目录"
    reason: "违反根目录清洁规则，且 Python 缓存不应提交"
    check: "test ! -d __pycache__"

  - id: "RED-ROOT-002"
    rule: "config.json 中的 task_queue 路径必须指向有效目录"
    reason: "frontend/task_queue/ 已被删除，配置引用无效路径会导致运行时错误"
    check: "grep task_queue config.json && 路径必须存在"

  - id: "RED-ROOT-003"
    rule: "cage/ 根目录只允许 active/ + archive/ + README.md"
    reason: "CONTRACTS.md 明确规范，cage/ 根目录不能散落其他文件"
    check: "ls cage/ | grep -v 'active\|archive\|README.md\|.DS_Store' 应为空"

  - id: "RED-ROOT-004"
    rule: "cage/archive/ 只能存放 .yaml 场景契约归档，不能放 .py 或设计文档 .md"
    reason: ".py 应归档到 ARCHIVED/v1.0_legacy/，设计文档不是场景契约"
    check: "ls cage/archive/ | grep -E '\.py$|[^_]\.md$' 应为空"

# ============================================================================
# 执行步骤
# ============================================================================
steps:
  - id: 1
    action: "删除 __pycache__/"
    verification: "test ! -d __pycache__"

  - id: 2
    action: "修复 config.json — 删除 task_queue 路径（目录已删除）"
    verification: "grep -q task_queue config.json → 应为空"

  - id: 3
    action: "迁移 cage/archive/ 中的 .py 到 ARCHIVED/v1.0_legacy/"
    verification: "ls cage/archive/ | grep '\.py$' → 空"

  - id: 4
    action: "迁移 cage/archive/ 中的非契约 .md 到 docs/archive/"
    verification: "ls cage/archive/ | grep '\.md$' → 仅保留契约相关"

  - id: 5
    action: "处理 cage/ 根目录 integrate_codegraph.yaml"
    verification: "ls cage/ | grep -v 'active\|archive\|.DS_Store' → 空"

  - id: 6
    action: "删除根目录 DIRECTORY_STRUCTURE_CONTRACT.md（与 contracts/directory_structure.md 完全重复）"
    verification: "diff 两个文件确认一致，然后 git rm 根目录副本"

  - id: 7
    action: "清理 prompts/ 下的 .audit_report.md 垃圾文件"
    verification: "find prompts/ -name '*.audit_report.md' → 空"

  - id: 8
    action: "更新 CHANGELOG.md 记录本次重构"
    verification: "CHANGELOG.md 包含 '目录清理' 条目"

  - id: 9
    action: "更新 pyproject.toml — 清理已不存在的 packages"
    verification: "grep data_providers pyproject.toml → 空"

  - id: 10
    action: "更新 pytest.ini — 清理过时规则"
    verification: "pytest.ini 的 norecursedirs 包含 scripts/"

# ============================================================================
# 质量门禁
# ============================================================================
quality_gates:
  p0:
    - "所有红线条目验证通过"
    - "git status clean"
    - "所有修改可 git commit"
  p1:
    - "CHANGELOG.md 更新"
    - "pyproject.toml / pytest.ini 更新"
