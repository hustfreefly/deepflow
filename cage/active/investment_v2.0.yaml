cage_version: "2.0.0"
component: investment
status: active
# Investment v2.0 契约
# 投资研究引擎 — 股票/基金投资分析管线

module: investment
version: "2.0"
created: "2026-05-30"
updated: "2026-05-30"
status: active
complexity: complex

description: |
  Investment 是 DeepFlow 的投资研究引擎。
  支持用户输入股票代码/名称，自动执行多维投资分析管线。

  核心架构: EntryHarness 验证 → PipelineOrchestrator 迭代执行
  管线阶段: 数据采集 → 规划 → 多维研究(并行) → 审计 → 修复 → 汇总
  收敛机制: 迭代评分 + 停滞检测 + 高分快速收敛

  差异化定位: "结构化投资研究，数据驱动 + 多维交叉验证"

# =============================================================================
# 红线 (P0 — 绝对不可违反)
# =============================================================================
redlines:
  - id: "RED-INV-001"
    rule: "禁止模块级 import openclaw，spawn_fn 必须通过注入"
    reason: "模块不应直接依赖 OpenClaw SDK，保持可测试性和环境无关性"
    check: "grep -r 'from openclaw import\\|import openclaw' domains/investment/ → 无匹配"

  - id: "RED-INV-002"
    rule: "输入验证必须通过 EntryHarness，禁止跳过"
    reason: "无效输入（空 code/name）会导致下游管线崩溃"
    check: "grep 'EntryHarness\\|entry_harness' domains/investment/cage_orchestrator.py → 有匹配"

  - id: "RED-INV-003"
    rule: "所有数据采集必须通过 Blackboard 存储，禁止内存直传"
    reason: "迭代收敛需要跨轮次数据持久化，内存直传无法支持断点恢复"
    check: "grep 'blackboard\\|BlackboardManager' domains/investment/cage_orchestrator.py → 有匹配"

  - id: "RED-INV-004"
    rule: "收敛判断必须满足最少 2 轮迭代，禁止单轮收敛"
    reason: "单轮分析缺乏交叉验证，结果不可靠"
    check: "grep 'iteration.*<.*2\\|iteration.*>=.*2' domains/investment/cage_orchestrator.py → 有匹配"

  - id: "RED-INV-005"
    rule: "Worker 间状态传递必须通过 Blackboard 文件，禁止函数参数直传"
    reason: "并行 Worker 无法通过函数参数传递状态，必须依赖共享存储"
    check: "检查 Worker task prompt 中是否包含 Blackboard 读写路径"

  - id: "RED-INV-006"
    rule: "数据采集阶段禁止因单个数据源失败终止管线"
    reason: "部分数据缺失不应阻塞整体分析，应 warn_and_continue"
    check: "grep 'warn_and_continue\\|failure_mode' domains/investment/config/investment.yaml → 有匹配"

  - id: "RED-INV-007"
    rule: "最终报告必须包含数据源引用，禁止无来源结论"
    reason: "投资研究的可信度依赖数据溯源，无引用 = 不可信"
    check: "检查 summarizer prompt 中是否要求引用数据源"

# =============================================================================
# L1: 接口契约
# =============================================================================
interface:
  python_modules:
    - "domains/investment/cage_orchestrator.py → InvestmentOrchestrator"
    - "core/data_providers/investment.py → register_providers()"

  worker_agents:
    - "planner: 规划分析维度"
    - "researcher_finance: 财务分析"
    - "researcher_tech: 技术分析"
    - "researcher_market: 市场分析"
    - "researcher_macro_chain: 宏观分析"
    - "researcher_management: 管理层分析"
    - "researcher_sentiment: 情绪分析"
    - "auditor: 审计验证"
    - "fixer: 问题修复"
    - "summarizer_enhanced: 最终汇总"

# =============================================================================
# L2: 行为契约
# =============================================================================
behavior:
  run_analysis:
    input: "code (股票代码), name (股票名称)"
    output: "Blackboard 中的分析报告 + 收敛状态"
    success: "管线完成且收敛，输出最终报告"
    failure: "管线中断，记录错误到 Blackboard"

  check_convergence:
    input: "iteration, score, prev_scores, max_iterations, target_score, stall_threshold"
    output: "{converged: bool, reason: str}"
    success: "正确判断收敛状态"
    failure: "误判导致过早收敛或无限迭代"

  generate_session_id:
    input: "code, name"
    output: "唯一 session_id (格式: investment_{code}_{name}_{uuid8})"
    success: "生成有效 ID"
    failure: "ID 冲突或格式错误"

# =============================================================================
# L3: 数据契约
# =============================================================================
data:
  blackboard:
    path: "blackboard/{session_id}/"
    required_files:
      - "stages/data_collection/output.json"
      - "stages/planning/output.json"
      - "stages/research/{worker}_output.json"
      - "stages/audit/output.json"
      - "final_report.md"

  config: "domains/investment/config/investment.yaml"

# =============================================================================
# 质量门禁
# =============================================================================
quality_gates:
  p0:
    - "RED-INV-001 到 RED-INV-007 全部通过"
    - "EntryHarness 验证通过"
    - "至少 2 轮迭代后收敛"
    - "最终报告包含数据源引用"
  p1:
    - "所有 Worker prompt 在 prompts/registry.yaml 中注册"
    - "收敛分数 ≥ 0.85"
    - "审计阶段无 P0 错误"
  p2:
    - "报告结构清晰、可读性强"
    - "多维分析覆盖度 ≥ 80%"
