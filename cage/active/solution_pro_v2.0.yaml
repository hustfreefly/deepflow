cage_version: "2.0.0"
component: solution_pro
module: solution_pro
version: "2.0.0"
created: "2026-07-06"
updated: "2026-07-06"
status: active
complexity: complex

description: |
  Solution Pro 2.0.0 (AI Native 重构版) — 三模块串联 Pipeline 架构。
  
  架构:
    Main Agent (depth-0)
      → exec: run_solution_pro(user_input, topic, ...) → spawn params
      → sessions_spawn → Orchestrator (depth-1)
    
    Orchestrator (depth-1): MasterOrchestrator
      → Phase 1: PlanningOrchestrator (规划)
      → Phase 2: ResearchOrchestrator (研究)
      → Phase 3: ReviewQCOrchestrator (审查 + 收敛)
      → ConvergenceLayer (收敛判定)
  
  Blackboard:
    .deepflow/blackboard/{project}/
    ├── spec/living_spec.json         ← Spec Pro 产出
    └── data/frozen_spec.json         ← Solution Pro 写入

red_lines:
  - 唯一入口: run_solution_pro()
  - 三模块串行: Planning → Research → ReviewQC
  - ConvergenceLayer 负责收敛判定
  - frozen_spec 必须包含 semantic_anchors (从 living_spec 透传)
  - Pydantic schemas 严格验证，raise ValueError

contracts:
  input:
    source: ".deepflow/blackboard/{project}/spec/living_spec.json"
    required_fields:
      - confirmed (requirements)
      - guardrails
      - semantic_anchors (from Spec Pro)
  output:
    format: frozen_spec.json
    location: ".deepflow/blackboard/{project}/data/frozen_spec.json"
    required_fields:
      - topic
      - requirements
      - guardrails
      - solution_pro_hints
      - semantic_anchors (透传自 living_spec)
