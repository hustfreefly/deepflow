# DeepFlow Frontend Phase 4 - Cron Job Contract v1.0

metadata:
  name: frontend_phase4_cron_v1.0
  version: "1.0"
  created: "2026-05-09"
  phase: 4
  description: "Cron Job fallback for webhook failures"

# Deliverables
deliverables:
  - name: setup_cron_job.sh
    path: scripts/setup_cron_job.sh
    type: shell_script
    description: "LaunchAgent setup script for macOS"
    gates:
      - type: syntax
        command: bash -n {path}
      - type: executable
        command: test -x {path}
      - type: plist_valid
        command: plutil -lint ~/Library/LaunchAgents/ai.openclaw.deepflow.cron.plist 2>/dev/null || echo "Will be created"
  
  - name: cron_task_checker.py
    path: core/agents/cron_task_checker.py
    type: python_module
    description: "Cron job task processor with retry logic"
    gates:
      - type: syntax
        command: python3 -m py_compile {path}
      - type: no_bare_except
        command: '! grep -q "except:" {path}'
      - type: imports
        command: python3 -c "from agents.cron_task_checker import main"

# Requirements
requirements:
  functional:
    - id: R1
      text: "Check for pending tasks every 30 seconds"
      verification: "LaunchAgent StartInterval=30"
    - id: R2
      text: "Retry failed webhook notifications"
      verification: "_process_failed_webhooks() implements retry"
    - id: R3
      text: "Mark stale running tasks as failed"
      verification: "_mark_stale_tasks_as_failed() implements timeout"
    - id: R4
      text: "Generate task queue summary"
      verification: "_generate_summary() returns statistics"
    - id: R5
      text: "Log to /tmp/openclaw/deepflow-cron.log"
      verification: "StandardOutPath in plist"
  
  non_functional:
    - id: N1
      text: "Exit code 0 = success, 1 = error, 2 = pending tasks"
      verification: "main() returns appropriate codes"
    - id: N2
      text: "Max 3 webhook retries per task"
      verification: "MAX_WEBHOOK_RETRIES=3"
    - id: N3
      text: "Tasks running >30min marked as stale"
      verification: "STALE_TASK_MINUTES=30"

# Signoff
signoff:
  required_reviews: 1
  verification_commands:
    - "launchctl list | grep deepflow-cron"
    - "cat /tmp/openclaw/deepflow-cron.log | tail -20"
    - "python3 core/agents/cron_task_checker.py"
