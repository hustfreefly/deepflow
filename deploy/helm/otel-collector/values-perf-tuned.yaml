# values-perf-tuned.yaml — OpenTelemetry Collector 性能调优 Helm Values
# 基于 100K traces/s 稳态 + 300K traces/s 突发 基准测试调优
# 覆盖 T-008 验收标准: AC-1 ~ AC-7

# ============================================================
# 全局配置
# ============================================================
global:
  environment: production
  # GOMEMLIMIT 设置为 memory_limiter 硬限制的 80%
  extraEnv:
    - name: GOMEMLIMIT
      value: "17179869184"  # 16 GiB (80% of 20 GiB limit)

# ============================================================
# Agent 资源配置（单节点）
# 验证 AC-4: Agent CPU≤70%, Memory≤80%（稳态下）
# 基于 100K traces/s 稳态负载
# ============================================================
agent:
  enabled: true
  replicaCount: 3
  resources:
    requests:
      cpu: "2000m"      # 2 vCPU
      memory: "4Gi"
    limits:
      cpu: "4000m"      # 4 vCPU (70% of 5700m = headroom)
      memory: "8Gi"     # 80% of 10Gi node allocatable
      # 满足 AC-4: CPU≤70%, Memory≤80%

  # Agent 级别的 batch processor 调优
  config:
    processors:
      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 200ms

    # Agent receiver 调优
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
            # 调优: 增加 max message size 和并发连接
            max_recv_msg_size_mib: 32           # 32 MiB
            max_concurrent_streams: 100          # gRPC 并发流
            keepalive:
              server_parameters:
                max_connection_age: 120s         # 连接最大存活时间
                max_connection_age_grace: 30s
                time: 60s
                timeout: 20s
          http:
            endpoint: "0.0.0.0:4318"
            max_request_body_size: 33554432      # 32 MiB

    # Agent 内存限制
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 6144                         # 6 GiB (75% of 8Gi limit)
        spike_limit_mib: 1536                   # 25% of limit_mib

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway]

# ============================================================
# Gateway 配置
# 验证 AC-5: 水平扩展线性比≥80%
# 验证 AC-6: 三级背压依次触发
# ============================================================
gateway:
  enabled: true
  replicaCount: 3                               # 基础 3 副本，支持 HPA 扩展至 12

  # Gateway 资源配置
  resources:
    requests:
      cpu: "4000m"      # 4 vCPU
      memory: "8Gi"
    limits:
      cpu: "8000m"      # 8 vCPU
      memory: "16Gi"

  # HPA 配置 — 水平扩展
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

  # Pod 反亲和 — 确保副本分布在不同节点
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: gateway
            topologyKey: kubernetes.io/hostname

  # Pod Disruption Budget — 确保最小可用副本
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
            max_recv_msg_size_mib: 64           # 64 MiB — 支持大 batch
            max_concurrent_streams: 200          # 高并发
            keepalive:
              server_parameters:
                max_connection_age: 300s
                max_connection_age_grace: 60s
                time: 120s
                timeout: 30s
          http:
            endpoint: "0.0.0.0:4318"
            max_request_body_size: 67108864      # 64 MiB

    # ============================================================
    # Processors — 性能调优核心
    # ============================================================
    processors:
      # 内存限制器 — 必须在 pipeline 最前面
      memory_limiter:
        check_interval: 1s
        limit_mib: 12288                        # 12 GiB (75% of 16Gi limit)
        spike_limit_mib: 3072                   # 25% of limit_mib

      # L1 背压 — 令牌桶限速（per-tenant）
      # 来自 T-005 产出
      ratelimit:
        # 默认租户: 50K traces/s
        rate: 50000
        burst: 75000
        metadata_keys: ["tenant_id", "x-tenant-id"]
        # VIP 租户覆盖
        overrides:
          - match: { tenant_id: "vip-tenant-1" }
            rate: 100000
            burst: 150000
          - match: { tenant_id: "vip-tenant-2" }
            rate: 80000
            burst: 120000

      # Batch Processor — 核心调优参数
      batch:
        # 调优参数: send_batch_size
        # 目标: 100K traces/s × 8 spans/trace = 800K spans/s
        # 设置 send_batch_size = 2048, timeout = 200ms
        # 理论批次数: 800K / 2048 ≈ 391 batches/s
        # 每个 batch ~200ms 积累 → 缓冲区 391 × 0.2 = 78 batches
        send_batch_size: 2048
        send_batch_max_size: 4096
        timeout: 200ms

      # 尾采样 — 来自 T-005 的 L3 降级策略
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 100000
        policies:
          # 策略链: 按优先级匹配，首个命中即决定
          - name: "P0-always-keep"
            type: string_attribute
            string_attribute:
              key: sampling.priority
              values: ["critical", "health-check"]
              enabled_regex_matching: false
          - name: "P1-error-keep"
            type: status_code
            status_code:
              status_codes: ["ERROR"]
          - name: "P2-high-latency-keep"
            type: numeric_attribute
            numeric_attribute:
              key: trace.duration_ms
              min_value: 5000
          - name: "P3-rate-limited-keep"
            type: rate_limiting
            rate_limiting:
              spans_per_second: 5000
          - name: "P4-drop"
            type: always_sample
            always_sample: {}

    # ============================================================
    # Exporters — Kafka 导出调优
    # 来自 T-006 的 Kafka 导出器配置
    # ============================================================
    exporters:
      # Kafka 导出器 — traces
      kafka/traces:
        brokers:
          - "kafka-bootstrap.kafka.svc.cluster.local:9093"
        topic: "otel-traces"
        encoding: otlp_proto
        protocol_version: "3.4.0"
        compression: snappy                      # snappy 平衡压缩率和 CPU
        # Producer 调优: batch size, flush interval, queue size
        batch_size: 16384                        # 16KB — 减少网络往返
        flush_interval: 100ms                    # 100ms flush — 平衡延迟和吞吐
        max_message_bytes: 10485760              # 10 MiB
        required_acks: all                       # 等待所有 ISR 确认
        partition_traces_by_id: true             # trace_id 一致性哈希
        # 发送队列调优
        sending_queue:
          enabled: true
          num_consumers: 20                      # 20 并发消费者
          queue_size: 5000                       # 5000 batches
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s
        # 持久化队列 — 防止重启丢数据
        storage: file_storage/backpressure
        tls:
          insecure: false
          ca_file: /etc/ssl/kafka/ca.crt
          cert_file: /etc/ssl/kafka/tls.crt
          key_file: /etc/ssl/kafka/tls.key
          min_version: "1.3"

      # Kafka 导出器 — metrics
      kafka/metrics:
        brokers:
          - "kafka-bootstrap.kafka.svc.cluster.local:9093"
        topic: "otel-metrics"
        encoding: otlp_proto
        protocol_version: "3.4.0"
        compression: snappy
        batch_size: 16384
        flush_interval: 200ms                    # metrics 可容忍更长 flush
        max_message_bytes: 10485760
        required_acks: 1                         # metrics 可容忍 acks=1
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 3000
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s
        storage: file_storage/backpressure
        tls:
          insecure: false
          ca_file: /etc/ssl/kafka/ca.crt
          cert_file: /etc/ssl/kafka/tls.crt
          key_file: /etc/ssl/kafka/tls.key
          min_version: "1.3"

      # Kafka 导出器 — logs
      kafka/logs:
        brokers:
          - "kafka-bootstrap.kafka.svc.cluster.local:9093"
        topic: "otel-logs"
        encoding: otlp_proto
        protocol_version: "3.4.0"
        compression: snappy
        batch_size: 16384
        flush_interval: 500ms                    # logs 可容忍更长 flush
        max_message_bytes: 10485760
        required_acks: 1
        partition_logs_by_trace_id: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 3000
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s
        storage: file_storage/backpressure
        tls:
          insecure: false
          ca_file: /etc/ssl/kafka/ca.crt
          cert_file: /etc/ssl/kafka/tls.crt
          key_file: /etc/ssl/kafka/tls.key
          min_version: "1.3"

      # Kafka 导出器 — audit
      kafka/audit:
        brokers:
          - "kafka-bootstrap.kafka.svc.cluster.local:9093"
        topic: "otel-audit"
        encoding: otlp_proto
        protocol_version: "3.4.0"
        compression: snappy
        batch_size: 16384
        flush_interval: 1000ms                   # audit 最大容忍延迟
        max_message_bytes: 10485760
        required_acks: all
        sending_queue:
          enabled: true
          num_consumers: 5
          queue_size: 2000
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s
        storage: file_storage/backpressure
        tls:
          insecure: false
          ca_file: /etc/ssl/kafka/ca.crt
          cert_file: /etc/ssl/kafka/tls.crt
          key_file: /etc/ssl/kafka/tls.key
          min_version: "1.3"

    # ============================================================
    # Extensions — 持久化存储
    # ============================================================
    extensions:
      file_storage/backpressure:
        directory: /var/lib/otelcol/backpressure
        timeout: 1s
        compaction:
          on_start: true
          directory: /var/lib/otelcol/backpressure/tmp
          max_transaction_size: 65536
        fsync: true

    # ============================================================
    # Service Pipeline 定义
    # ============================================================
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, ratelimit, batch, tail_sampling]
          exporters: [kafka/traces]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [kafka/metrics]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [kafka/logs]
        logs/audit:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [kafka/audit]

  # ============================================================
  # 持久化存储卷
  # ============================================================
  persistence:
    enabled: true
    storageClass: "ssd"                          # SSD 存储类
    accessMode: ReadWriteOnce
    size: 50Gi                                  # 50 GiB 用于持久化队列

  # ============================================================
  # Metrics & ServiceMonitor
  # ============================================================
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 15s
      scrapeTimeout: 10s

# ============================================================
# ClickHouse 存储层配置
# 验证 AC-7: ClickHouse INSERT 频率≤1次/s/分区
# ============================================================
clickhouse:
  exporter:
    # 控制 INSERT 频率
    # 目标: ≤1 INSERT/s/partition
    batch_size: 100000                           # 100K rows per INSERT
    flush_interval: 1000ms                       # 1s flush interval
    # 分区策略: 按小时分区
    # 每个分区每小时最多 INSERT 3600 次
    # 实际 INSERT 频率: 60/min (1/s) 满足 AC-7
    partition_by: "toStartOfHour(timestamp)"

# ============================================================
# 调优参数汇总
# ============================================================
# 参数                    | 稳态值      | 说明
# ------------------------|------------|---------------------------
# batch.send_batch_size   | 2048       | 每批 span 数
# batch.timeout           | 200ms      | 批处理超时
# kafka.batch_size        | 16384      | Kafka producer batch (bytes)
# kafka.flush_interval    | 100ms      | Kafka flush 间隔
# kafka.queue_size        | 5000       | 发送队列容量 (batches)
# kafka.num_consumers     | 20         | 并发消费者数
# memory_limiter.limit    | 12288 MiB  | Gateway 内存硬限制
# memory_limiter.spike    | 3072 MiB   | 峰值缓冲
# ratelimit.rate          | 50000      | 每租户限速 (traces/s)
# worker.count            | 3          | Agent 副本数
# hpa.min/max             | 3/12       | Gateway 水平扩展范围
# ch.batch_size           | 100000     | ClickHouse 批量写入
# ch.flush_interval       | 1000ms     | ClickHouse flush 间隔