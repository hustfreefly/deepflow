{{- if .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "otel-collector.fullname" . }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
    prometheus: {{ .Values.monitoring.prometheusInstance | default "kube-prometheus-stack" }}
    role: alert-rules
spec:
  groups:
    # ============================================================
    # Group 1: Collector Availability & Restart
    # ============================================================
    - name: otelcol-availability
      rules:
        - alert: OtelcolCollectorRestart
          expr: |
            rate(otelcol_process_uptime_seconds[1m]) < 0
          for: 1m
          labels:
            severity: warning
            component: otel-collector
          annotations:
            summary: "OpenTelemetry Collector {{ $labels.pod }} restarted"
            description: >
              OpenTelemetry Collector pod {{ $labels.pod }} on node {{ $labels.node }}
              has restarted. The uptime counter reset, indicating a process restart.
              This may indicate a crash, OOM kill, or manual restart.
              Check pod logs with: kubectl logs -n {{ .Release.Namespace }} {{ $labels.pod }}

        - alert: OtelcolCollectorDown
          expr: |
            up{job=~"{{ include "otel-collector.fullname" $ }}-(agent|gateway)"} == 0
          for: 5m
          labels:
            severity: critical
            component: otel-collector
          annotations:
            summary: "OpenTelemetry Collector {{ $labels.pod }} is down"
            description: >
              OpenTelemetry Collector pod {{ $labels.pod }} has been unreachable
              for more than 5 minutes. The metrics endpoint is not responding.
              Check pod status with: kubectl get pod -n {{ .Release.Namespace }} {{ $labels.pod }}

    # ============================================================
    # Group 2: Exporter Queue & Data Loss
    # ============================================================
    - name: otelcol-exporter
      rules:
        - alert: OtelcolExporterQueueHighUsage
          expr: |
            max by (pod, exporter, signal) (
              otelcol_exporter_queue_size / otelcol_exporter_queue_capacity
            ) > 0.70
          for: 5m
          labels:
            severity: warning
            component: otel-collector
          annotations:
            summary: "OTel Collector exporter queue > 70% on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector exporter '{{ $labels.exporter }}' queue
              for signal '{{ $labels.signal }}' on pod {{ $labels.pod }} has been
              above 70% capacity for 5 minutes.
              Current usage: {{ $value | humanizePercentage }}.
              This indicates backpressure or a slow downstream backend.
              Consider scaling up the Gateway or checking the downstream backend health.

        - alert: OtelcolExporterQueueCritical
          expr: |
            max by (pod, exporter, signal) (
              otelcol_exporter_queue_size / otelcol_exporter_queue_capacity
            ) > 0.90
          for: 2m
          labels:
            severity: critical
            component: otel-collector
          annotations:
            summary: "OTel Collector exporter queue > 90% on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector exporter '{{ $labels.exporter }}' queue
              for signal '{{ $labels.signal }}' on pod {{ $labels.pod }} has been
              above 90% capacity for 2 minutes. Data loss risk is imminent.
              Current usage: {{ $value | humanizePercentage }}.
              Immediate action required: scale Gateway instances or investigate
              downstream backend.

        - alert: OtelcolExporterFailureRate
          expr: |
            rate(otelcol_exporter_send_failed_spans[5m]) > 0
            or
            rate(otelcol_exporter_send_failed_metric_points[5m]) > 0
            or
            rate(otelcol_exporter_send_failed_log_records[5m]) > 0
          for: 5m
          labels:
            severity: warning
            component: otel-collector
          annotations:
            summary: "OTel Collector exporter failures on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector on pod {{ $labels.pod }} is experiencing
              export failures. Check the exporter configuration and downstream
              backend connectivity.

        - alert: OtelcolExporterErrorRateHigh
          expr: |
            (
              rate(otelcol_exporter_send_failed_spans[5m])
              /
              (rate(otelcol_exporter_sent_spans[5m]) + rate(otelcol_exporter_send_failed_spans[5m]))
            ) > 0.01
          for: 5m
          labels:
            severity: critical
            component: otel-collector
          annotations:
            summary: "OTel Collector export error rate > 1% on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector on pod {{ $labels.pod }} has an export error
              rate above 1% for more than 5 minutes.
              Current error rate: {{ $value | humanizePercentage }}.
              This indicates a systemic issue with the downstream backend.
              Check backend health, network connectivity, and authentication.

    # ============================================================
    # Group 3: Resource Usage (Memory & CPU)
    # ============================================================
    - name: otelcol-resources
      rules:
        - alert: OtelcolHighMemoryUsage
          expr: |
            (
              otelcol_process_runtime_total_alloc_bytes
              / on(pod) group_left(container)
              kube_pod_container_resource_limits{resource="memory"}
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: otel-collector
          annotations:
            summary: "OTel Collector memory usage > 80% on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector pod {{ $labels.pod }} has been using more
              than 80% of its memory limit for 10 minutes.
              Current usage: {{ $value | humanizePercentage }}.
              This may indicate a memory leak, high traffic volume, or
              high-cardinality metrics. Consider increasing the memory limit
              or investigating the memory_limiter configuration.

        - alert: OtelcolCriticalMemoryUsage
          expr: |
            (
              otelcol_process_runtime_total_alloc_bytes
              / on(pod) group_left(container)
              kube_pod_container_resource_limits{resource="memory"}
            ) > 0.95
          for: 5m
          labels:
            severity: critical
            component: otel-collector
          annotations:
            summary: "OTel Collector memory usage > 95% on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector pod {{ $labels.pod }} is critically low on
              memory, using more than 95% of its limit. OOM kill is imminent.
              Current usage: {{ $value | humanizePercentage }}.
              Immediate action required.

        - alert: OtelcolHighCPUUsage
          expr: |
            (
              rate(otelcol_process_cpu_seconds_total[5m]) * 100
              / on(pod) group_left(container)
              kube_pod_container_resource_limits{resource="cpu"}
            ) > 0.70
          for: 5m
          labels:
            severity: warning
            component: otel-collector
          annotations:
            summary: "OTel Collector CPU usage > 70% on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector pod {{ $labels.pod }} has been using more
              than 70% of its CPU limit for 5 minutes.
              Current usage: {{ $value | humanizePercentage }}.
              This may indicate an overloaded Collector. Evaluate load balancing
              strategy and processing configuration.

        - alert: OtelcolCriticalCPUUsage
          expr: |
            (
              rate(otelcol_process_cpu_seconds_total[5m]) * 100
              / on(pod) group_left(container)
              kube_pod_container_resource_limits{resource="cpu"}
            ) > 0.90
          for: 5m
          labels:
            severity: critical
            component: otel-collector
          annotations:
            summary: "OTel Collector CPU usage > 90% on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector pod {{ $labels.pod }} is critically CPU-bound,
              using more than 90% of its CPU limit. This may cause processing
              delays and backpressure. Current usage: {{ $value | humanizePercentage }}.

    # ============================================================
    # Group 4: Certificate & TLS
    # ============================================================
    - name: otelcol-tls
      rules:
        - alert: OtelcolCertificateExpiringSoon
          expr: |
            otelcol_tls_certificate_expiry_seconds < 2592000
          for: 1h
          labels:
            severity: warning
            component: otel-collector
          annotations:
            summary: "OTel Collector TLS certificate expires in < 30 days on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector TLS certificate on pod {{ $labels.pod }}
              will expire in less than 30 days ({{ $value | humanizeDuration }}).
              Renew the certificate before it expires to avoid TLS handshake
              failures and service disruption.

        - alert: OtelcolCertificateExpiringCritical
          expr: |
            otelcol_tls_certificate_expiry_seconds < 604800
          for: 1h
          labels:
            severity: critical
            component: otel-collector
          annotations:
            summary: "OTel Collector TLS certificate expires in < 7 days on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector TLS certificate on pod {{ $labels.pod }}
              will expire in less than 7 days ({{ $value | humanizeDuration }}).
              Immediate certificate renewal is required to prevent TLS handshake
              failures and service disruption.

    # ============================================================
    # Group 5: Data Rejection & Processing
    # ============================================================
    - name: otelcol-processing
      rules:
        - alert: OtelcolReceiverRefusedSpans
          expr: |
            rate(otelcol_receiver_refused_spans[5m]) > 0
          for: 5m
          labels:
            severity: warning
            component: otel-collector
          annotations:
            summary: "OTel Collector refusing spans on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector on pod {{ $labels.pod }} is refusing spans.
              This may indicate that the receiver is overwhelmed or misconfigured.
              Check the receiver configuration and capacity.

        - alert: OtelcolProcessorDroppedSpans
          expr: |
            rate(otelcol_processor_dropped_spans[5m]) > 0
          for: 5m
          labels:
            severity: warning
            component: otel-collector
          annotations:
            summary: "OTel Collector processor dropping spans on {{ $labels.pod }}"
            description: >
              OpenTelemetry Collector on pod {{ $labels.pod }} has processors
              dropping spans. This may be caused by the memory_limiter or
              rate-limiting processor. Check memory limits and processor configuration.
{{- end }}