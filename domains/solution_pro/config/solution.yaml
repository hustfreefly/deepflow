component_version: "4.4"
component_name: "解决方案设计"

# DeepFlow Domain Configuration - Solution Designer (通用解决方案设计)
# Version: 2026-04-26-v1

domain: solution
name: "解决方案设计"
description: "通用解决方案与架构设计产出，支持软件架构、业务方案、技术方案"

# Mode 系统配置（Quick/Standard/Rigorous）
modes:
  quick:
    stages: [data_collection, planning, reviewers, research, consolidator, audit, fix, fixer_expert, harness_final, summarizer]
    max_iterations: 1
    audit: standard
    research: true
    data_collection: basic
    expected_duration: "50 minutes"
    description: "兼容入口：执行固定10阶段管线"
  
  standard:
    stages: [data_collection, planning, reviewers, research, consolidator, audit, fix, fixer_expert, harness_final, summarizer]
    max_iterations: 2
    audit: standard
    research: true
    data_collection: basic
    expected_duration: "50 minutes"
    description: "标准模式：固定10阶段 Harness 2.0.0 管线，产出完整方案"
  
  rigorous:
    stages: [data_collection, planning, reviewers, research, consolidator, audit, fix, fixer_expert, harness_final, summarizer]
    max_iterations: 3
    audit: strict
    research: deep
    data_collection: full
    expected_duration: "50 minutes"
    description: "严谨模式：固定10阶段管线，强化审计和追溯"

# 上下文 Schema（定义该领域需要的字段）
context:
  schema:
    required: ["topic", "type"]
    optional: ["constraints", "stakeholders", "budget", "timeline"]
  example:
    topic: "设计一个高并发电商订单系统"
    type: "architecture"  # architecture | business | technical
    constraints: ["日均百万订单", "99.99%可用性", "<200ms响应"]
    stakeholders: ["技术团队", "产品团队", "运维团队"]

# 方案类型定义
solution_types:
  architecture:
    name: "软件架构设计"
    output_format: "c4_model"
    sections:
      - context_diagram      # C4 L1: 系统上下文
      - container_diagram    # C4 L2: 容器图
      - component_diagram    # C4 L3: 组件图（可选）
      - tech_stack           # 技术栈选型
      - data_flow            # 数据流设计
      - deployment_view      # 部署视图
    
  business:
    name: "业务解决方案"
    output_format: "structured_report"
    sections:
      - problem_analysis     # 问题分析
      - solution_overview    # 方案概览
      - detailed_design      # 详细设计
      - implementation_roadmap  # 实施路线
      - risk_mitigation      # 风险缓解
      - success_metrics      # 成功指标
    
  technical:
    name: "技术方案"
    output_format: "technical_spec"
    sections:
      - architecture_decisions  # 架构决策记录
      - system_design          # 系统设计
      - api_design             # 接口设计
      - data_model             # 数据模型
      - security_design        # 安全设计
      - performance_plan       # 性能规划

# Agents 列表（PipelineEngine 从这里读取）
agents:
  - role: data_collection
    prompt: "domains/solution/prompts/data_collection.md"
    timeout: 300
    model: "bailian/qwen3.5-plus"
    description: "采集背景资料并生成结构化需求"
  
  - role: planning
    prompt: "domains/solution/prompts/planner_harness.md"
    timeout: 300
    model: "bailian/qwen3.5-plus"
    description: "分析需求并生成 Planner 动态契约"
  
  - role: reviewer
    prompt: "domains/solution/prompts/reviewer_harness.md"
    timeout: 300
    model: "kimi/kimi-code"
    parallel: all
    description: "三视角评审：技术、业务、风险"
    instances:
      - name: technical
        angle: "技术架构合理性"
      - name: business
        angle: "业务可行性"
      - name: risk
        angle: "风险与合规"
  
  - role: researcher
    prompt: "domains/solution/prompts/researcher_harness.md"
    timeout: 300
    model: "bailian/qwen3.5-plus"
    parallel: all
    description: "Planner 映射后的三专家并行研究"
    instances:
      - name: expert_1
        angle: "动态专家槽位1"
      - name: expert_2
        angle: "动态专家槽位2"
      - name: expert_3
        angle: "动态专家槽位3"
  
  - role: consolidator
    prompt: "domains/solution/prompts/consolidator_harness.md"
    timeout: 300
    model: "kimi/kimi-code"
    description: "整合研究结果为统一方案"
  
  - role: auditor
    prompt: "domains/solution/prompts/auditor_harness.md"
    timeout: 300
    model: "kimi/kimi-code"
    description: "审计统一方案"
  
  - role: fixer
    prompt: "domains/solution/prompts/fixer_harness.md"
    timeout: 300
    model: "bailian/qwen3.5-plus"
    description: "根据审计意见修复方案"
  
  - role: fixer_expert
    prompt: "domains/solution/prompts/fixer_expert_harness.md"
    timeout: 300
    model: "bailian/qwen3.5-plus"
    description: "深度修复关键问题"
  
  - role: harness_final
    prompt: "domains/solution/prompts/harness_v3.md"
    timeout: 300
    model: "kimi/kimi-code"
    description: "最终质量门禁并产出需求追溯矩阵"
  
  - role: summarizer
    prompt: "domains/solution/prompts/summarizer_harness.md"
    timeout: 300
    model: "bailian/qwen3.5-plus"
    description: "生成最终结构化结果和方案文档"

# Pipeline 阶段定义
pipeline:
  stages:
    # Stage 1: 数据采集
    - name: data_collection
      type: single_worker
      workers:
        - role: data_collection
          timeout: 300
      description: "根据 mode 采集技术文档、行业报告、竞品分析数据"
    
    # Stage 2: 需求分析
    - name: planning
      type: single_worker
      workers:
        - role: planning
          timeout: 300
      description: "分析需求，生成动态专家、Layer2约束和验收标准"
    
    # Stage 3: 评审阶段（三视角并行）
    - name: reviewers
      type: parallel_workers
      workers:
        - role: technical
          count: 1
          timeout: 300
        - role: business
          count: 1
          timeout: 300
        - role: risk
          count: 1
          timeout: 300
      description: "三视角并行评审：技术、业务、风险"
    
    # Stage 4: 研究阶段（3个researcher并行）
    - name: research
      type: parallel_workers
      workers:
        - role: expert_1
          count: 1
          timeout: 300
        - role: expert_2
          count: 1
          timeout: 300
        - role: expert_3
          count: 1
          timeout: 300
      description: "Planner 映射后的三专家并行研究"
    
    # Stage 5: 成果整合
    - name: consolidator
      type: single_worker
      workers:
        - role: consolidator
          timeout: 300
      description: "整合研究结果并形成统一方案"
    
    # Stage 6: 审计阶段
    - name: audit
      type: single_worker
      workers:
        - role: auditor
          timeout: 300
      description: "审计统一方案的完整性、必要性、目标一致性和全局影响"
    
    # Stage 7: 修复阶段
    - name: fix
      type: single_worker
      workers:
        - role: fixer
          timeout: 300
      description: "根据审计意见修正方案"
    
    # Stage 8: 专家深度修复
    - name: fixer_expert
      type: single_worker
      workers:
        - role: fixer_expert
          timeout: 300
      description: "深度修复关键问题"
    
    # Stage 9: 最终质量门禁
    - name: harness_final
      type: single_worker
      workers:
        - role: harness_final
          timeout: 300
      description: "最终质量门禁并生成 requirements_traceability_matrix.json"
    
    # Stage 10: 方案产出
    - name: summarizer
      type: single_worker
      workers:
        - role: summarizer
          timeout: 300
      description: "整合并产出 final_result.json 和 final_solution.md"

# 模型 Fallback 链配置 (P1-002)
model_chain:
  primary: "bailian/qwen3.5-plus"
  fallback: "bailian/kimi-k2.5"
  emergency: "kimi/kimi-code"
  max_fallback_rounds: 3

# 收敛检测配置（默认值，会被 mode 覆盖）
convergence:
  min_iterations: 1
  max_iterations: 2  # 默认 standard 模式的值
  target_score: 0.90
  stall_threshold: 0.02
  oscillation_threshold: 2

# 质量评估维度
quality:
  dimensions:
    - name: correctness
      weight: 0.30
      threshold: 0.90
      description: "方案正确性"
    - name: completeness
      weight: 0.25
      threshold: 0.85
      description: "方案完整性"
    - name: feasibility
      weight: 0.20
      threshold: 0.80
      description: "实施可行性"
    - name: innovation
      weight: 0.15
      threshold: 0.75
      description: "创新差异化"
    - name: clarity
      weight: 0.10
      threshold: 0.80
      description: "表达清晰度"

# 输出配置
output:
  format: "markdown"
  template_dir: "templates/solution"
  include_diagrams: true
  language: "zh-CN"
  sections_required: true

# 渐进交付配置
delivery:
  progressive: true
  checkpoints:
    - stage: planning
      deliver: quick_preview      # 30s: 方案类型+关键维度
    - stage: design
      deliver: partial_draft      # 2min: 核心架构/方案框架
    - stage: deliver
      deliver: final              # 最终完整方案

# 并发控制配置 (P0-FIX: 限制最大并行数，避免超出OpenClaw限制)
concurrency:
  max_parallel_workers: 3      # 最大并行Worker数
  worker_timeout: 300          # Worker 默认超时
  orchestrator_timeout: 600    # Orchestrator 超时
