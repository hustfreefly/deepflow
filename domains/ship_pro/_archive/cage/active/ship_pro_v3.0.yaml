cage_version: "1.0.0"
component: ship_pro

module: ship_pro
version: "3.0.0"
created: "2026-06-19"
updated: "2026-06-19"
status: active
complexity: complex

description: |
  Ship Pro V3 是 AI Native 多 Agent 协作系统。
  消费 Solution Pro 输出的 final_result.json，通过 5 个独立 LLM Agent
  （Architect/Decomposer/Specifier/Reviewer/Packager）协作生成 ship_package.json。
  不基于确定性编译器，用 LLM 理解力替代规则匹配。

redlines:
  - id: "RED-SHIP-V3-001"
    rule: "Ship Pro V3 消费 final_result.json，不读取 Solution Pro 内部 blackboard 文件"
    reason: "隔离上下游"
    check: "Agent prompt 中只引用 final_result.json 路径"

  - id: "RED-SHIP-V3-002"
    rule: "5 个 Agent 必须通过 sessions_spawn 独立启动，禁止共享上下文"
    reason: "上下文隔离是质量保障的基础"
    check: "每个 Agent 只看到上游 Agent 的 blackboard 输出文件"

  - id: "RED-SHIP-V3-003"
    rule: "ship_package.json 必须通过 ship_package_v3.schema.json 校验"
    reason: "机器校验 > 人工检查"
    check: "eval_code_checks.py 的 schema_compliance 检查通过"

  - id: "RED-SHIP-V3-004"
    rule: "Agent 间通过 blackboard 文件传递数据，文件名必须统一为 xxx_output.json（下划线）"
    reason: "文件名不一致导致下游 Agent 读取失败（Phase 3.5 真实管线验证发现）"
    check: "blackboard 目录下所有文件名为 xxx_output.json 格式"

  - id: "RED-SHIP-V3-005"
    rule: "Ship Pro V3 禁止直接调用 Codex 或执行代码"
    reason: "Ship Pro 只产出工作包，Super Loop 负责执行"
    check: "Agent prompt 和 orchestrator 中无 exec/codex 调用"

  - id: "RED-SHIP-V3-006"
    rule: "每个 Agent 输出必须包含 _meta 版本快照（prompt_sha + model_id + run_id + round）"
    reason: "可追溯性"
    check: "所有 Agent 输出 JSON 的 _meta 字段完整"

  - id: "RED-SHIP-V3-007"
    rule: "Reviewer 反馈必须包含 target_agent（自然语言 + 路由），Orchestrator 据此智能路由"
    reason: "反馈闭环收敛的关键"
    check: "reviewer_output.json 中每个 issue 有 target_agent 字段"

  - id: "RED-SHIP-V3-008"
    rule: "Packager 必须完整传递 acceptance_criteria 文本，禁止只保留 count"
    reason: "AI Coding Agent 需要完整的 AC 文本来理解验收标准（Phase 3.5 真实管线验证发现）"
    check: "packager_output.json 中每个 WP 的 acceptance_criteria 是非空数组且包含文本"

interface:
  agents:
    - architect: "final_result.json → blueprint"
    - decomposer: "blueprint → wp_structure"
    - specifier: "blueprint + wp_structure → wp_specs"
    - reviewer: "blueprint + wp_specs → review_report"
    - packager: "all outputs → ship_package + summary"

  orchestrator:
    path: "domains/ship_pro/scripts/orchestrator.py"
    entry: "python3 orchestrator.py <input> <output_dir>"

behavior:
  architect:
    input: "final_result.json (Format A/B/C/D)"
    output: "blueprint (modules, dependencies, domain_details, sla_constraints, requirements, risks)"
    success: "所有可识别模块被提取，overall_confidence 反映数据充足性"
    failure: "格式无法识别 → confidence=low，modules=[]"

  decomposer:
    input: "blueprint"
    output: "wp_structure (work_packages, dependency_edges)"
    success: "所有模块被至少一个 WP 覆盖，依赖无环"
    failure: "模块遗漏或依赖有环"

  specifier:
    input: "blueprint + wp_structure"
    output: "wp_specs (每个 WP 的 AC、budget、complexity、constraints)"
    success: "AC 可验证性评分 ≥ 70，每个 WP ≥ 2 条 L3+"
    failure: "AC 全为 L1 或大量空泛"

  reviewer:
    input: "blueprint + wp_specs (+ previous review if round > 0)"
    output: "review_report (verdict, issues with target_agent)"
    success: "verdict = PASS/FAIL/PASS_WITH_CONDITIONS"
    failure: "无法生成有效 verdict"

  packager:
    input: "all Agent outputs"
    output: "ship_package.json + summary.md"
    success: "通过 schema 校验，AC 文本完整传递"
    failure: "schema 校验失败或 AC 丢失"

data:
  blackboard:
    path: "{output_dir}/blackboard/"
    files:
      - "final_result.json (input)"
      - "architect_output.json"
      - "decomposer_output.json"
      - "specifier_output.json"
      - "reviewer_output.json"
      - "packager_output.json"
      - "summary.md"

quality_gates:
  p0:
    - "ship_package.json 通过 schema 校验"
    - "所有 Agent 输出包含 _meta 版本快照"
    - "文件名统一为 xxx_output.json"
    - "acceptance_criteria 完整传递（非 count）"
    - "依赖图无环"
  p1:
    - "AC 可验证性评分 ≥ 70"
    - "模块覆盖率 100%"
    - "需求覆盖率 ≥ 90%"
  p2:
    - "summary.md 可读性良好"
    - "context_files 无幻影引用"

evolution:
  v0.1:
    status: archived
    scope: "确定性编译器（已废弃）"
  v3.0:
    status: current
    scope: "AI Native 5 Agent 协作 + sessions_send 反馈闭环 + 三层质量评估"
