component_version: "2.0.0"
component_name: "交付包生成"

# DeepFlow Domain Configuration - Ship Pro
# Version: 2026-07-04

domain: ship
name: "交付包生成"
description: "读取 Solution Pro 方案输出，拆分为可执行 Work Packages，合并为 ShipPackage"

# Mode 系统配置
modes:
  quick:
    stages: [planner, workers, judge, consolidator, ship_assembly, validation]
    max_iterations: 1
    audit: standard
    expected_duration: "30 minutes"
    description: "快速模式：单轮 Worker 执行，最小验证"

  standard:
    stages: [planner, workers, judge, consolidator, ship_assembly, validation]
    max_iterations: 2
    audit: standard
    expected_duration: "45 minutes"
    description: "标准模式：完整管线，含 MUST Judge 语义验证"

  rigorous:
    stages: [planner, workers, judge, consolidator, ship_assembly, validation]
    max_iterations: 3
    audit: strict
    expected_duration: "60 minutes"
    description: "严谨模式：多轮迭代，强化审计和追溯"

# 上下文 Schema
context:
  schema:
    required: ["solution_pro_output", "project_name"]
    optional: ["constraints", "quality_threshold"]
  example:
    solution_pro_output: "stages/final_result.json"
    project_name: "示例项目"
    constraints: ["交付周期 2 周"]
    quality_threshold: 0.85

# Pipeline 阶段定义
pipeline:
  stages:
    - name: planner
      type: single_worker
      workers:
        - role: planner
          timeout: 300
      description: "分析 Solution Pro 输出，生成 PipelinePlan（Worker 拆分 + 依赖图）"

    - name: workers
      type: parallel_workers
      workers:
        - role: worker
          count: 3
          timeout: 300
      description: "按依赖拓扑分层执行 Worker，产出 Work Packages"

    - name: judge
      type: parallel_workers
      workers:
        - role: must_judge
          count: 1
          timeout: 300
      description: "MUST 约束语义验证（LLM Judge）"

    - name: consolidator
      type: single_worker
      workers:
        - role: consolidator
          timeout: 300
      description: "整合所有 Worker 输出为统一 ShipPackage"

    - name: ship_assembly
      type: single_worker
      workers:
        - role: ship_assembler
          timeout: 300
      description: "装配 ShipPackage 并写入 ship_package.json"

    - name: validation
      type: single_worker
      workers:
        - role: validator
          timeout: 300
      description: "L1-L4 验证 + 信息守恒审计"

# 质量评估维度
quality:
  dimensions:
    - name: completeness
      weight: 0.30
      threshold: 0.85
      description: "Work Package 完整性"
    - name: traceability
      weight: 0.25
      threshold: 0.80
      description: "需求追溯覆盖度"
    - name: feasibility
      weight: 0.20
      threshold: 0.80
      description: "执行可行性"
    - name: conservation
      weight: 0.15
      threshold: 0.85
      description: "信息守恒度"
    - name: clarity
      weight: 0.10
      threshold: 0.80
      description: "表达清晰度"

# 并发控制
concurrency:
  max_parallel_workers: 3
  worker_timeout: 300
  orchestrator_timeout: 600

# 输出配置
output:
  format: "json"
  language: "zh-CN"
  artifacts:
    - ship_package.json
    - ship_package.md
    - validation_report.json
