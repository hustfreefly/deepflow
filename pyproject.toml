[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepflow"
version = "2.0.0"
description = "全自动多Agent协作研究管线"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "小满", email = "example@email.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
# deepflow = "core.unified_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "domains*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "check_*.py"]

[tool.ruff]
# 与 cage/active/dev_quality_v1.0.yaml 保持一致
target-version = "py310"
extend-exclude = ["blackboard", "_archive", "domains/*/_archive", "contracts/shared/_archived"]

[tool.ruff.lint.per-file-ignores]
# E402 例外：以下文件必须先执行 sys.path bootstrap 才能导入项目模块。
# 名单只允许存量文件；新增文件不得加入（dev_quality RED-DQ-004 + tests/contracts/test_e402_allowlist.py）。
