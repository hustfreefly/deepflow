    - solution/planner      # filename: planner.md, 文件不存在
    - solution/researcher_template  # 保留（有文件）
    - solution/designer     # 保留（有文件）
    - solution/consolidator # filename: consolidator.md, 文件不存在
    - solution/fixer_expert # filename: fixer_expert.md, 文件不存在
