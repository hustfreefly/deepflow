    - solution/auditor      # filename: auditor.md, 文件不存在
    - solution/fixer        # filename: fixer.md, 文件不存在
    - solution/harness_final_v2  # filename: reviewer_v2_harness.md, 已被新ID替代
    - solution/pipeline_orchestrator  # filename: pipeline_orchestrator.md, 文件不存在
  # 重命名 prompt_id key + 更新 filename 字段
  rename_ids:
    - old_id: solution/planner_v2_harness
      new_id: solution/planner
      new_filename: planner.md
    - old_id: solution/researcher_v2_harness
      new_id: solution/researcher
      new_filename: researcher.md
    - old_id: solution/reviewer_v2_harness
      new_id: solution/reviewer
      new_filename: reviewer.md
