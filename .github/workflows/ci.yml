name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract gate (G3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Contract tests
        run: python -m pytest tests/contracts -q
      - name: Validator CLI
        run: python scripts/validate.py --all
      - name: Install ruff
        run: python -m pip install "ruff==0.15.20"
      - name: Quality gate (format + error rules)
        run: |
          ruff format --check .
          ruff check --select E9,F63,F7,F82 .

  full-suite:
    name: Full suite (staged)
    runs-on: ubuntu-latest
    needs: contracts
    # Phase 1/2 修复 189 个顺序污染后，把 continue-on-error 改为 false
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Full suite (network excluded by pytest.ini)
        run: python -m pytest -q
